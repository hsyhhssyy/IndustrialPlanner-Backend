name: Release
run-name: Release ${{ inputs.tag_name || github.ref_name }}

# beta: Docker + K8s（beta 库）；stable: Docker + K8s（正式库）+ GitHub Release。
# pre: 仅 GitHub prerelease，不触发容器部署。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pre[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-pre[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-Patch[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要重新发布的 tag，例如 v0.1.0、v0.1.1-beta1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.tag_name || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    outputs:
      tag: ${{ steps.classify.outputs.tag }}
      channel: ${{ steps.classify.outputs.channel }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Classify and validate tag
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          beta_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-beta[0-9]+$'
          pre_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-pre[0-9]+$'
          stable_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'
          patch_pattern='^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-Patch[0-9]+$'

          if [[ "$RELEASE_TAG" =~ $beta_pattern ]]; then
            channel='beta'
          elif [[ "$RELEASE_TAG" =~ $pre_pattern ]]; then
            channel='pre'
          elif [[ "$RELEASE_TAG" =~ $stable_pattern || "$RELEASE_TAG" =~ $patch_pattern ]]; then
            channel='stable'
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo 'Expected vX.Y.Z[.N], vX.Y.Z[.N]-betaN, vX.Y.Z[.N]-preN, or vX.Y.Z.N-PatchN.' >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"

      - name: Generate changelog
        if: steps.classify.outputs.channel != 'beta'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range='HEAD'
          fi

          body="$(git log "$range" --pretty=format:'- %s (%h)' --no-merges --max-count=50)"
          if [ -z "$body" ]; then
            body="Release $RELEASE_TAG"
          fi

          changelog_file="$RUNNER_TEMP/changelog.md"
          printf '%s\n' "$body" > "$changelog_file"
          echo "changelog_file=$changelog_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.classify.outputs.channel != 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.classify.outputs.tag }}
          name: ${{ steps.classify.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: ${{ steps.classify.outputs.channel == 'pre' }}

  build:
    name: Build ${{ needs.prepare.outputs.tag }}
    needs: prepare
    if: needs.prepare.outputs.channel == 'beta' || needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    outputs:
      image: ${{ steps.container.outputs.image }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Load container publish config
        id: container
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          jq -e '
            [.registry, .username, .password, .image_name]
            | all(type == "string" and length > 0)
          ' "$config_file" > /dev/null

          registry="$(jq -r '.registry' "$config_file")"
          username="$(jq -r '.username' "$config_file")"
          password="$(jq -r '.password' "$config_file")"
          image_name="$(jq -r '.image_name' "$config_file")"
          image="${registry}/${image_name}:${RELEASE_TAG}"

          echo "::add-mask::$password"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image"
            if [ "$RELEASE_CHANNEL" = 'stable' ]; then
              echo "${registry}/${image_name}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.container.outputs.registry }}
          username: ${{ steps.container.outputs.username }}
          password: ${{ steps.container.outputs.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.container.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.channel == 'beta' || needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Load deploy config
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"

          domain="$(jq -r '.domain' "$config_file")"
          namespace="$(jq -r '.namespace' "$config_file")"
          database_url="$(jq -r ".${RELEASE_CHANNEL}.database_url" "$config_file")"
          redis_url="$(jq -r ".${RELEASE_CHANNEL}.redis_url" "$config_file")"

          # 验证所有必需字段非空
          for var in domain namespace database_url redis_url; do
            val="${!var}"
            if [ -z "$val" ] || [ "$val" = 'null' ]; then
              echo "Missing or null: $var (channel=${RELEASE_CHANNEL})" >&2
              exit 1
            fi
          done

          echo "domain=$domain" >> "$GITHUB_ENV"
          echo "namespace=$namespace" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "REDIS_URL=$redis_url" >> "$GITHUB_ENV"

      - name: Render and apply K8s manifests
        env:
          DOMAIN: ${{ env.domain }}
          NAMESPACE: ${{ env.namespace }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          kubeconfig_file="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$kubeconfig_file"
          chmod 600 "$kubeconfig_file"
          export KUBECONFIG="$kubeconfig_file"

          envsubst < .github/k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status deployment/industrial-planner-backend -n "$NAMESPACE" --timeout=120s
