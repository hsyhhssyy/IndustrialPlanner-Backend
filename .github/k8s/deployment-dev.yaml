apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-dev-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-sync-dev
  labels:
    app: industrial-sync-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: industrial-sync-dev
  template:
    metadata:
      labels:
        app: industrial-sync-dev
    spec:
      imagePullSecrets:
        - name: docker.hsyhhssyy.net
      containers:
        - name: sync-dev
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOCAL_DEV_HOST
              value: "https://${DOMAIN}"
            - name: COMMIT_TOKEN_SECRET
              value: "dev-secret-key-32-bytes-long!!"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sync-dev-data
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-sync-dev
spec:
  selector:
    app: industrial-sync-dev
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-sync-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: industrial-sync-dev-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: industrial-sync-dev
                port:
                  number: 80
