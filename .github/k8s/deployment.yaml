apiVersion: v1
kind: Secret
metadata:
  name: industrial-planner-backend
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  REDIS_URL: "${REDIS_URL}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-planner-backend
  labels:
    app: industrial-planner-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-planner-backend
  template:
    metadata:
      labels:
        app: industrial-planner-backend
    spec:
      imagePullSecrets:
        - name: docker.hsyhhssyy.net
      containers:
        - name: api
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: industrial-planner-backend
          env:
            - name: HTTP_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "industrial_planner_backend=info,tower_http=info"
            - name: ENVIRONMENT
              value: "${ENVIRONMENT}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-planner-backend
spec:
  selector:
    app: industrial-planner-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-planner-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: industrial-planner-backend-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: industrial-planner-backend
                port:
                  number: 80
