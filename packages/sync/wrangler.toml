# Sync Worker — 多端同步与冲突检测
name = "industrial-sync"
main = "src/index.ts"
compatibility_date = "2025-08-06"
workers_dev = false
preview_urls = false

# D1 数据库：同步元数据
[[d1_databases]]
binding = "DB"
database_name = "sync-db"
database_id = "34197a80-811a-4e06-bbc8-c633b8db1044"

# R2 存储：不可变 payload
# AI-CORRECTION 2026-08-08: RQ-007 改为每资产固定 key 的最新态覆盖，不再按 hash 永久新增。
# AI-CORRECTION 2026-08-24: 每资产固定身份下使用有界 A/B 两个完成态 key；更新写非活动槽，不再覆盖已发布槽。
[[r2_buckets]]
binding = "BLOB_STORE"
bucket_name = "industrial-sync-blobs"

# 环境变量
[vars]
PROTOCOL_VERSION = "cf-sync-v2"
MAX_MUTATIONS_PER_BATCH = "32"
MAX_METADATA_SIZE = "262144"
R2_ENTER_THRESHOLD_BYTES = "614400"
D1_RETURN_THRESHOLD_BYTES = "552960"
MAX_BATCH_D1_BLOB_BYTES = "8388608"
MAX_R2_BLOB_BYTES = "26214400"
UPLOAD_TTL_SECONDS = "900"
ALLOW_ANONYMOUS_SPACES = "false"
# LOCAL_DEV_HOST 仅通过 .dev.vars（本地）或 K8s 环境变量（Beta）注入
# 不在此处设默认值，避免 wrangler dev 覆盖环境变量

# Service Bindings（Phase 2 启用 assets-worker 依赖）
# [[services]]
# binding = "ASSETS"
# service = "industrial-assets"

[env.production]
# COMMIT_TOKEN_SECRET 通过 wrangler secret put 设置
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET_NAME 通过 wrangler secret put 设置

[env.production.vars]
ENVIRONMENT = "production"

[env.beta]
name = "industrial-sync-beta"
workers_dev = false
preview_urls = false

[[env.beta.d1_databases]]
binding = "DB"
database_name = "sync-db-beta"
database_id = "a4270dd4-a6f6-45fe-b657-078a70cc6a21"

[[env.beta.r2_buckets]]
binding = "BLOB_STORE"
bucket_name = "industrial-sync-blobs-beta"

[env.beta.vars]
ENVIRONMENT = "beta"
PROTOCOL_VERSION = "cf-sync-v2"
MAX_MUTATIONS_PER_BATCH = "32"
MAX_METADATA_SIZE = "262144"
R2_ENTER_THRESHOLD_BYTES = "614400"
D1_RETURN_THRESHOLD_BYTES = "552960"
MAX_BATCH_D1_BLOB_BYTES = "8388608"
MAX_R2_BLOB_BYTES = "26214400"
UPLOAD_TTL_SECONDS = "900"
ALLOW_ANONYMOUS_SPACES = "true"

[env.beta.triggers]
crons = ["*/5 * * * *"]

[triggers]
crons = ["*/5 * * * *"]

[dev]
port = 8080
