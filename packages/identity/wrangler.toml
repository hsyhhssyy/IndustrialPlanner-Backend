# Identity Worker — 账户与本地认证（空壳）
# AI-CORRECTION 2026-08-23: Stage 2 启用最小账户与后端会话，并仅允许 Service Binding 调用。
name = "industrial-identity"
main = "src/index.ts"
compatibility_date = "2025-08-06"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "identity-db"
