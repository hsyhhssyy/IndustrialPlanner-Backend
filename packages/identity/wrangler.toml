[vars]
SESSION_TTL_SECONDS = "604800"

[env.beta]
name = "industrial-identity-beta"
workers_dev = false
preview_urls = false

[[env.beta.d1_databases]]
binding = "DB"
database_name = "identity-db-beta"
database_id = "50a8d338-f858-4200-9661-d2a408a10777"

[env.beta.vars]
SESSION_TTL_SECONDS = "604800"

[dev]
port = 8789
