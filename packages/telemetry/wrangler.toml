# Telemetry Worker — 匿名遥测
name = "industrial-telemetry"
main = "src/index.ts"
compatibility_date = "2025-08-06"

# D1 数据库：遥测记录存储
[[d1_databases]]
binding = "DB"
database_name = "telemetry-db"
database_id = "b77bba55-8093-48c0-9007-41b59029ad04"

# 路由（生产环境由 gateway 转发，这里用于独立测试）
# [[routes]]
# pattern = "telemetry.industrial-planner.local/*"
# zone_id = ""

[env.beta]
name = "industrial-telemetry-beta"

[[env.beta.d1_databases]]
binding = "DB"
database_name = "telemetry-db-beta"
database_id = "6da845c8-f6be-4690-a791-deeb4380e459"

[dev]
port = 8080
