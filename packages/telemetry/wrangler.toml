# Telemetry Worker — 匿名遥测
name = "industrial-telemetry"
main = "src/index.ts"
compatibility_date = "2025-08-06"

# D1 数据库：遥测记录存储
[[d1_databases]]
binding = "DB"
database_name = "telemetry-db"
database_id = ""  # wrangler d1 create 后填写

# KV 命名空间：限流计数器
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""  # wrangler kv:namespace create 后填写

[[kv_namespaces]]
binding = "RATE_LIMIT"
preview_id = "telemetry-rate-limit-preview"  # 本地开发使用

# 路由（生产环境由 gateway 转发，这里用于独立测试）
# [[routes]]
# pattern = "telemetry.industrial-planner.local/*"
# zone_id = ""

[dev]
port = 8080
