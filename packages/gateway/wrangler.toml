# Gateway Worker — 路由分发、JWT 验证、CORS
name = "industrial-gateway"
main = "src/index.ts"
compatibility_date = "2025-08-06"
workers_dev = false
preview_urls = false

[vars]
ALLOW_ANONYMOUS_SPACES = "false"

# 路由：所有流量经 Gateway
[[routes]]
pattern = "endfield-api.anonymous-test.top"
custom_domain = true

# Service Bindings（其他 Worker 实现后逐步启用）
# [[services]]
# binding = "TELEMETRY"
# service = "industrial-telemetry"
# [[services]]
# binding = "IDENTITY"
# service = "industrial-identity"
[[services]]
binding = "SYNC"
service = "industrial-sync"

[[services]]
binding = "OAUTH"
service = "industrial-oauth"

[[services]]
binding = "TELEMETRY"
service = "industrial-telemetry"

# Beta 环境：绑定 beta 版 Worker
[env.beta]
name = "industrial-gateway-beta"
workers_dev = false
preview_urls = false

[env.beta.vars]
ENVIRONMENT = "beta"
ALLOW_ANONYMOUS_SPACES = "true"

[[env.beta.routes]]
pattern = "endfield-api.richetriotour.net"
custom_domain = true

[[env.beta.services]]
binding = "SYNC"
service = "industrial-sync-beta"

[[env.beta.services]]
binding = "OAUTH"
service = "industrial-oauth-beta"

[[env.beta.services]]
binding = "TELEMETRY"
service = "industrial-telemetry-beta"

# 本地开发时，Service Bindings 指向本地运行的 Worker
[dev]
port = 8787

[env.production.vars]
ENVIRONMENT = "production"
