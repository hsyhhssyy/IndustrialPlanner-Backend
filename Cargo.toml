[package]
name = "industrial-planner-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8.4", features = ["json", "tokio"] }
chrono = { version = "0.4.41", features = ["serde"] }
http = "1.3.1"
ipnet = "2.11.0"
redis = { version = "0.32.5", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "mysql", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.4", features = ["cors", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
