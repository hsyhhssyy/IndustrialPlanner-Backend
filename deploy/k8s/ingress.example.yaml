# 将 hosts 和 tls.secretName 替换为实际值后再应用。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-planner-backend
  annotations:
    # k3s 默认 Traefik 可保留此项；迁移至其他 Ingress Controller 时按需修改。
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - endfield-api.amiyabot.com
      secretName: replace-with-tls-secret
  rules:
    - host: endfield-api.amiyabot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: industrial-planner-backend
                port:
                  name: http
