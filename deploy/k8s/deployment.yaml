apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-planner-backend
  labels:
    app.kubernetes.io/name: industrial-planner-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-planner-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-planner-backend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-me/industrial-planner-backend:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: industrial-planner-backend
            - secretRef:
                name: industrial-planner-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
