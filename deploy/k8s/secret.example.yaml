apiVersion: v1
kind: Secret
metadata:
  name: industrial-planner-backend
type: Opaque
stringData:
  # 二选一：服务根据 DATABASE_URL 的 scheme 自动选择 PostgreSQL 或 MySQL。
  DATABASE_URL: "postgres://industrial_planner:replace-me@postgres.example:5432/industrial_planner"
  # DATABASE_URL: "mysql://industrial_planner:replace-me@mysql.example:3306/industrial_planner"
  REDIS_URL: "redis://redis.example:6379"
